name: 'Setup Bun'

description: 'Setup bun'

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # Pinned: the B13 dist invariants were verified on 1.3.14, and Bun 1.4 changed CJS interop (#241)
        bun-version: 1.3.14

    - name: Install dependencies
      shell: bash
      run: bun install