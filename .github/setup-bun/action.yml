name: 'Setup Bun'

description: 'Setup bun'

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # Pinned: the B13 dist invariants were verified on 1.3.14, and Bun 1.4 changed CJS interop (#241)
        bun-version: 1.3.14

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
