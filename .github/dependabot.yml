# Dependabot version updates (B27 #364, docs/v1/build.md › CI and release). Security updates and alerts are
# enabled in the repo settings; this file adds weekly version updates. Every PR goes through CI, the leader read
# and security for any bun.lock or lifecycle-script change. CodeRabbit skips Dependabot PRs and bun.lock
# (.coderabbit.yaml). No PR is auto-merged.
version: 2
updates:
  # Workspace dependencies: bun.lock covers the root, packages/* and examples/*
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Never propose an updated package younger than two weeks, the same rule as the SHA and version pins. The
    # cooldown does not cover transitive versions that bun resolves anew; the bun.lock review checks their age.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      bun-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["v1", "area: build"]
    commit-message:
      prefix: "build(deps)"

  # Every action is pinned by a commit SHA with a `# vX.Y.Z` comment, and Dependabot bumps both together.
  # The composite action in .github/setup-bun is not under .github/workflows, so it is listed as its own directory.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/setup-bun"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["v1", "area: build"]
    commit-message:
      prefix: "ci(deps)"
