name: 'CI'
on:
  # Any base branch, so stacked PRs (based on another PR's branch) are checked too
  pull_request:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs bun and runs `bun install`
      - name: Setup bun
        uses: ./.github/setup-bun

      - name: Build
        run: bun run build && bun run build:type

      # B13 guard (#188): no workspace package inlined, every entry loads (ESM + CJS)
      - name: Check dist
        run: bun run check:dist

      # Only the v1 packages for now; full suite tracked in #184 (H16)
      - name: Smoke test v1 packages
        run: bunx vitest run packages/contract packages/core packages/client packages/sauf/__tests__/di packages/sauf/__tests__/typegen

      # C6 (#94): *.test-d.ts type tests; vitest typecheck runs tsc and fails on a broken type
      - name: Type tests
        run: bunx vitest run --project types
