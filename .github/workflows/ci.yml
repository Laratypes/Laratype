name: 'CI'
on:
  # Any base branch, so stacked PRs (based on another PR's branch) are checked too
  pull_request:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    # Name kept although the job runs the full suite: a required status check would match it by name
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs bun and runs `bun install`
      - name: Setup bun
        uses: ./.github/setup-bun

      - name: Build
        run: bun run build && bun run build:type

      # B13 guard (#188): no workspace package inlined, every entry loads (ESM + CJS)
      - name: Check dist
        run: bun run check:dist

      # B16 (#191): publint --strict and attw on every public package; needs dist, so after Check dist
      - name: Check packages
        run: bun run check:pkg

      # H16 (#184): every vitest workspace project, unit and types (C6 #94: *.test-d.ts through tsc).
      # After Build: some tests load the built dist.
      - name: Test
        run: bunx vitest run

      # B22 (#277): Biome lint-only (no formatting) until the repo-wide format lands.
      # Last, so a lint error does not hide the build and test results
      - name: Lint
        run: bun run check:lint
