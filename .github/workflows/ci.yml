name: 'CI'
on:
  # Any base branch, so stacked PRs (based on another PR's branch) are checked too
  pull_request:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    # Name kept although the job runs the full suite: a required status check would match it by name
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs bun and runs `bun install`
      - name: Setup bun
        id: setup
        uses: ./.github/setup-bun

      # B14 #189: no git/tarball/other-registry source, no missing integrity,
      # no trustedDependencies or install script outside the allowlist
      - name: Check lockfile
        run: bun run check:lockfile

      - name: Build
        run: bun run build && bun run build:type

      # B13 guard (#188): no workspace package inlined, every entry loads (ESM + CJS)
      - name: Check dist
        run: bun run check:dist

      # B16 (#191): publint --strict and attw on every public package; needs dist, so after Check dist
      - name: Check packages
        run: bun run check:pkg

      # H16 (#184): every vitest workspace project, unit and types (C6 #94: *.test-d.ts through tsc).
      # After Build: some tests load the built dist.
      - name: Test
        run: bunx vitest run

      # B22 (#277): Biome lint-only (no formatting) until the repo-wide format lands.
      # Last, so a lint error does not hide the build and test results; runs even when they fail.
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check:lint

      # B14 #189: high/critical advisories in bun.lock fail. Last, like Lint, so a
      # failure does not hide the build and test results.
      - name: Audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun audit --audit-level=high
