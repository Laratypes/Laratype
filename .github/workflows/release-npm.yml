name: 'Publish Packages'

on:
  # The maintainer pushes v<version> after merging the "Version packages" PR; the tag is the release intent, so a
  # commit that lands on master alone never publishes. workflow_dispatch is the manual fallback and must run from
  # master (checked below); an agent never triggers it.
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# npm trusted publishing for the release (B15 #190, docs/v1/build.md › CI and release): the job authenticates with
# a GitHub OIDC token, which npm exchanges for a short-lived publish token, and `--provenance` signs the statement
# the same way. No registry credential is configured, so there is no secret to exfiltrate; `contents: read` is all
# the checkout uses.
permissions:
  contents: read
  id-token: write

# One release at a time; a queued release waits instead of being cancelled mid-publish
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm registry
    runs-on: ubuntu-latest
    # Required reviewers are configured in the repository settings, and the npm trusted publisher of each package
    # points at this environment (repo Laratypes/Laratype, workflow release-npm.yml, environment npm-release), so
    # npm accepts only this job's OIDC token and a publish waits for a reviewer.
    environment: npm-release
    steps:
      # A manual dispatch may only run from refs/heads/master. This is the first step so a non-master dispatch
      # fails before the checkout and before setup-bun runs `bun install` (which runs lifecycle scripts).
      - name: Refuse a non-master dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        shell: bash
        run: |
          echo "::error::manual publish must run from refs/heads/master, not $GITHUB_REF"
          exit 1

      # Nothing below needs git auth; keep the token out of .git/config while pack and publish run.
      # Full history is for the tag ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The ref checks need no dependency install, so they run right after checkout and before setup-bun (which runs
      # `bun install`, with lifecycle scripts) while `id-token: write` is live. A push must be a tag; the tag must be
      # `v` + the committed version and its commit an ancestor of origin/master. A manual dispatch must be
      # refs/heads/master at its current tip. Context values arrive as env, never interpolated into the script.
      - name: Check the release ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./packages/laratype/package.json').version")

          if [ "$EVENT_NAME" = "push" ]; then
            test "$REF_TYPE" = "tag" || {
              echo "::error::unexpected push ref $REF in the release workflow"; exit 1; }
            test "$REF_NAME" = "v$version" || {
              echo "::error::tag $REF_NAME does not match the tree version $version"; exit 1; }
            git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
            git merge-base --is-ancestor "$SHA" refs/remotes/origin/master || {
              echo "::error::tag $REF_NAME is not an ancestor of origin/master"; exit 1; }
          else
            test "$REF" = "refs/heads/master" || {
              echo "::error::manual publish must run from refs/heads/master, not $REF"; exit 1; }
            git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
            test "$SHA" = "$(git rev-parse refs/remotes/origin/master)" || {
              echo "::error::manual publish must run from the tip of origin/master"; exit 1; }
          fi

      - name: Setup bun
        uses: ./.github/setup-bun

      # Trusted publishing needs npm >= 11.5.1, so the runner's bundled npm is upgraded below
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Pinned to an exact release (>= 11.5.1, at least two weeks old when pinned) instead of a range, so a newly
      # published npm can't run in the release job before anyone has seen it
      - name: Upgrade npm
        run: |
          npm install -g 'npm@11.21.0'
          npm --version

      # `check --publish` validates the fixed versions, the alpha channel, pre.json and the private-package rule;
      # dist-tag derives alpha/latest from the version, never chosen by hand. The ref checks already ran above.
      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p "require('./packages/laratype/package.json').version")
          node scripts/release/cli.js check --version "$version" --publish
          dist_tag=$(node scripts/release/cli.js dist-tag "$version")

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build

      - name: Build declarations
        run: bun run build:type

      # `npm publish` ships `workspace:` and `catalog:` specifiers as-is, so each package is packed with
      # `bun pm pack`, which resolves them, and the tarball is published instead of the directory.
      # A public package is every packages/*/package.json without "private": true.
      - name: Publish
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          set -euo pipefail

          pack_dir="$RUNNER_TEMP/npm-pack"
          mkdir -p "$pack_dir"

          published=0
          skipped=0

          for pkg_json in packages/*/package.json; do
            pkg_dir=$(dirname "$pkg_json")
            name=$(node -p "require('./$pkg_json').name")
            version=$(node -p "require('./$pkg_json').version")

            if [ "$(node -p "require('./$pkg_json').private === true")" = "true" ]; then
              echo "Skipping $name@$version: private package"
              continue
            fi

            if [ "$version" != "$VERSION" ]; then
              echo "::error::$name@$version does not match the release version $VERSION"
              exit 1
            fi

            # A re-run, or a release where some packages were already published, skips those versions
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version: already published on npm"
              skipped=$((skipped + 1))
              continue
            fi

            tarball=$(cd "$pkg_dir" && bun pm pack --destination "$pack_dir" --quiet | tr -d '\r' | tail -n 1)
            if [ ! -f "$tarball" ]; then
              echo "::error::bun pm pack produced no tarball for $name@$version"
              exit 1
            fi

            # Never publish a tarball whose manifest still needs a workspace to resolve.
            # The manifest is read into a variable first, so a broken tarball fails the step
            # instead of looking like a manifest with nothing to grep.
            manifest=$(tar -xzOf "$tarball" package/package.json)
            if printf '%s' "$manifest" | grep -q -E '(workspace|catalog):'; then
              echo "::error::$name@$version still carries workspace:/catalog: specifiers in its tarball"
              exit 1
            fi

            echo "Publishing $name@$version from $(basename "$tarball") with dist-tag $DIST_TAG"
            npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
            published=$((published + 1))
          done

          echo "Published $published package(s) with dist-tag $DIST_TAG, skipped $skipped already on npm"
