name: 'Bench'

# Manual runs only. On a pull request, adding the `bench` label is the trigger (re-add it to rerun; only users with
# triage/write can label). On master, use Actions > bench > Run workflow. There is no push or schedule trigger:
# shared runners are not a threshold, and the benchmark is heavy.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated apps: laratype,hono,express,fastify'
        required: false
        default: 'laratype,hono,express,fastify'
        type: string
      runtimes:
        description: 'Comma-separated runtimes: node,bun'
        required: false
        default: 'node,bun'
        type: string
      duration:
        description: 'Measured seconds per scenario'
        required: false
        default: '10'
        type: string
      connections:
        description: 'Concurrent connections'
        required: false
        default: '50'
        type: string
  # NEVER pull_request_target: this job builds and runs code from the pull request.
  pull_request:
    types: [labeled]

permissions:
  contents: read

# One bench per PR/ref and trigger. The label is part of the group on purpose: every `labeled` event starts a
# workflow run, even when the added label is not `bench`, and a run that shares the group with cancel-in-progress
# would cancel the bench that is running before its own job is skipped by the `if`. With the label in the group,
# only a new `bench` label add joins the bench group and cancels the previous bench; any other label runs in its own
# group and is a skipped job. A dispatch gets the `workflow_dispatch` suffix, so a label add cannot cancel it.
concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  bench:
    name: Run the runtime benchmark
    # workflow_dispatch is the master path; on a pull request the job runs only when the added label is `bench`.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Dispatch inputs arrive as environment only, never interpolated inside a run script. A pull_request run has
      # no inputs, so these are empty and the runner falls back to every app/runtime, 10 s and 50 connections.
      BENCH_APPS: ${{ github.event.inputs.apps }}
      BENCH_RUNTIMES: ${{ github.event.inputs.runtimes }}
      BENCH_DURATION: ${{ github.event.inputs.duration }}
      BENCH_CONNECTIONS: ${{ github.event.inputs.connections }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned base images (bench/Dockerfile); no registry login and no secret. The image contains Node 22.23.5,
      # Bun 1.3.14, the built workspace dists and autocannon.
      - name: Build the bench image
        run: docker build -f bench/Dockerfile -t laratype-bench .

      # The report lands in bench/out on the runner through the /out mount. The commit metadata is passed as
      # environment because the Docker build context has no .git; github.sha is the checked-out commit (for a
      # pull_request run that is the merge commit the image was built from).
      - name: Run the benchmark
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p bench/out
          docker run --rm \
            -e BENCH_APPS -e BENCH_RUNTIMES -e BENCH_DURATION -e BENCH_CONNECTIONS \
            -e BENCH_OUT=/out \
            -e BENCH_GIT_SHA="$COMMIT_SHA" \
            -e BENCH_GIT_BRANCH="$COMMIT_BRANCH" \
            -v "$PWD/bench/out:/out" \
            laratype-bench

      # A failed run can still write a partial report, so both of the next steps run even when the benchmark fails.
      - name: Add the Markdown report to the job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(bench/out/*.md)
          if [ ${#reports[@]} -gt 0 ]; then
            latest=$(ls -t "${reports[@]}" | head -n 1)
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the JSON and Markdown report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench/out
          if-no-files-found: warn
